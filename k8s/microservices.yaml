apiVersion: v1
kind: Service
metadata:
  name: ms-flota-rest
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: ms-flota-rest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-flota-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-flota-rest
  template:
    metadata:
      labels:
        app: ms-flota-rest
    spec:
      containers:
        - name: ms-flota-rest
          image: logiflow/ms-flota-rest:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/logiflow_flota
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: logiflow-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logiflow-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
