apiVersion: v1
kind: Service
metadata:
  name: ms-flota-rest
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: ms-flota-rest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-flota-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-flota-rest
  template:
    metadata:
      labels:
        app: ms-flota-rest
    spec:
      containers:
        - name: ms-flota-rest
          image: logiflow/ms-flota-rest:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/logiflow_flota
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: "1234"
          ports:
            - containerPort: 8081
---
