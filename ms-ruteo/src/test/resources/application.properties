spring.application.name=ms-ruteo-test
server.port=8086

# Base de datos H2 en memoria para pruebas
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Desactivar autoinicio de listeners de RabbitMQ para pruebas unitarias sin broker
spring.rabbitmq.listener.simple.auto-startup=false

# URLs de Microservicios Colaboradores (REST) para test
flota.service.url=http://localhost:8081
pedidos.service.url=http://localhost:8085
